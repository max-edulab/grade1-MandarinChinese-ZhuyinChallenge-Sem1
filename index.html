<style>
/* 版面：一台像素遊戲機——上方標題列＋開關，下面一塊天空和草地的舞台，題目、選項都在舞台裡。故意只有一種白天的配色。 */
:root{
  --sky:#5c94fc; --sky2:#8fd0ff; --grass:#5cb03c; --grass2:#7ccc4c;
  --ink:#1b1b2f; --paper:#fffbe8; --brick:#c84c0c; --gold:#fcbc3c; --leaf:#2f8a1e; --red:#c8283c; --muted:#6a6a80;
  --ok-bg:#c8f4b0; --no-bg:#ffd0d0; --white:#ffffff;

  --f-px:"Press Start 2P",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-zy);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}

.wrap{max-width:1000px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}

.chip[aria-pressed="true"]{background:var(--gold)}
.chip:active{transform:translateY(3px);box-shadow:none}

.sy{display:inline-flex;align-items:flex-end;vertical-align:middle;margin:.1em .1em;padding-right:.36em;line-height:1}

.btn{font-weight:900;font-size:22px;color:var(--white);background:var(--brick);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:8px 20px;cursor:pointer}

.qz-top{display:flex;align-items:center;gap:12px;flex:none}

  background:repeating-linear-gradient(-45deg,#ffe3ef 0 10px,#fff6c8 10px 20px)}
.qz-done{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:repeating-linear-gradient(-45deg,#ffb3d1 0 10px,#ffd76a 10px 20px);transition:width .5s steps(5)}
.qz-steps{position:absolute;left:14px;right:40px;top:50%;translate:0 -50%;display:flex;justify-content:space-between;align-items:center}
.qz-step{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #c8a0b8}

/* 愛心：扣掉的那顆會碎掉、抖一抖；補回來的那顆會跳一下 */
.qz-heart{display:inline-block}

.qz-heart.gain{animation:qzGain .5s steps(4)}
@keyframes qzLose{0%{transform:scale(1.6)}30%{transform:scale(1.6) rotate(-15deg)}60%{transform:scale(1.3) rotate(15deg)}100%{transform:scale(1)}}

.qz-stat{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}

.qz-pic{width:clamp(80px,16vh,140px);height:clamp(80px,16vh,140px);image-rendering:pixelated;image-rendering:crisp-edges}

.qz-opts.n2{--n:2}.qz-opts.n3{--n:3}
.qz-opt{position:relative;display:flex;align-items:center;justify-content:center;min-height:clamp(80px,16vh,130px);background:var(--white);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;color:var(--ink);font-weight:900;font-size:clamp(34px,7vh,60px);padding:6px;white-space:nowrap}

.qz-opt:active:not(:disabled){transform:translateY(5px);box-shadow:none}
.qz-opt.ok{background:var(--ok-bg);border-color:var(--leaf)}
.qz-opt.no{background:var(--no-bg);opacity:.75;animation:qzShake .3s steps(3)}

/* 注音一個音節一行，上下排列 */
.qz-zy{display:flex;flex-direction:column;align-items:center;gap:.32em}
.qz-zy .sy{margin:0;padding-right:.36em}
.qz-opt{padding:10px 6px}
.qz-opt.s2{font-size:clamp(32px,5.6vh,48px)}

.qz-fb{flex:none;min-height:32px;text-align:center;font-weight:900;font-size:22px}
.qz-fb .ok{color:var(--white);background:var(--leaf);border:3px solid var(--ink);padding:1px 12px}

/* 開始、過關、家長紀錄的面板 */

<script>
/* ================= 工具：注音、音效、語音、像素圖 ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const starsHtml = n => [0, 1, 2].map(i => `<span class="${i < n ? '' : 'off'}">★</span>`).join('');
const INK = '#1b1b2f';
const BPM = /[ㄅ-ㄯ]/, TONE = /[ˊˇˋ]/, CJK = /[㐀-鿿]/;
// 注音（直式）；給國字就排成「國字＋注音」，只給注音就只顯示注音
const Z = (s, han) => {
  s = String(s);
  const chars = typeof han === 'string' ? [...han].filter(c => CJK.test(c)) : [];
  const toks = [];
  let dot = false, letters = '';
  const flush = tone => { if (letters || dot) toks.push({ dot, letters, tone }); letters = ''; dot = false; };
  for (const ch of s){
    if (/\s/.test(ch)){ flush(); continue; }
    if (ch === '˙'){ flush(); dot = true; continue; }
    if (BPM.test(ch)){ letters += ch; continue; }
    if (TONE.test(ch) && letters){ flush(ch); continue; }
    flush(); toks.push({ pu:ch });
  }
  flush();
  const nSy = toks.filter(t => !t.pu).length, pair = chars.length === nSy && nSy > 0;
  let k = 0;
  return toks.map(t => {
    if (t.pu) return `<span class="pu">${esc(t.pu)}</span>`;
    const sy = `<span class="sy${[...t.letters].length > 1 ? ' m' : ''}"><span class="col">${t.dot ? '<i class="dot">˙</i>' : ''}${[...t.letters].map((c, i, a) => `<b>${c}${t.tone && i === a.length - 1 ? `<i class="tn">${t.tone}</i>` : ''}</b>`).join('')}</span></span>`;
    return pair ? `<span class="ru"><span class="hz">${esc(chars[k++])}</span>${sy}</span>` : sy;
  }).join('');
};

let AC = null, muted = false, voiceOn = true;
function audio(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(f, d, type = 'square', v = .05, when = 0){
  if (muted) return; const a = audio(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03);
}
// 答對、答錯的聲音差很多，家長在旁邊用聽的就分得出來
const SFX = {
  blip: () => beep(880, .05, 'square', .04),
  ok:   () => [523, 659, 784, 1047].forEach((f, i) => beep(f, .12, 'square', .05, i * .08)),
  no:   () => { beep(220, .14, 'sawtooth', .05); beep(165, .24, 'sawtooth', .05, .14); },
  clear:() => [523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => beep(f, i === 6 ? .5 : .13, 'square', .05, i * .15))
};
const canSpeak = 'speechSynthesis' in window;
function speak(text){
  if (!canSpeak || !voiceOn) return;
  try {
    const s = window.speechSynthesis; s.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-TW'; u.rate = .8;
    const vs = s.getVoices(), v = vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang));
    if (v) u.voice = v;
    s.speak(u);
  } catch (e) {}
}
// emoji 變成 18×18 的像素圖（加一圈深色描邊）
function emojiSprite(e){
  const big = document.createElement('canvas'); big.width = big.height = 72;
  const bg = big.getContext('2d');
  bg.font = '44px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  bg.textAlign = 'center'; bg.textBaseline = 'middle';
  bg.fillText(e, 36, 38);
  const bd = bg.getImageData(0, 0, 72, 72).data;
  let x0 = 72, y0 = 72, x1 = -1, y1 = -1;
  for (let y = 0; y < 72; y++) for (let x = 0; x < 72; x++) if (bd[(y * 72 + x) * 4 + 3] > 40){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const c = document.createElement('canvas'); c.width = c.height = 18;
  const g = c.getContext('2d');
  if (x1 >= 0){
    const w = x1 - x0 + 1, h = y1 - y0 + 1, sc = Math.min(16 / w, 16 / h);
    g.imageSmoothingEnabled = true;
    g.drawImage(big, x0, y0, w, h, 1 + (16 - w * sc) / 2, 1 + (16 - h * sc) / 2, w * sc, h * sc);
  }
  const id = g.getImageData(0, 0, 18, 18), d = id.data;
  for (let i = 3; i < d.length; i += 4) d[i] = d[i] < 110 ? 0 : 255;
  g.putImageData(id, 0, 0);
  const op = i => d[i * 4 + 3] > 0, edge = [];
  for (let y = 0; y < 18; y++) for (let x = 0; x < 18; x++){
    const i = y * 18 + x; if (op(i)) continue;
    if ((x > 0 && op(i - 1)) || (x < 17 && op(i + 1)) || (y > 0 && op(i - 18)) || (y < 17 && op(i + 18))) edge.push(i);
  }
  g.fillStyle = INK; edge.forEach(i => g.fillRect(i % 18, Math.floor(i / 18), 1, 1));
  return c;
}

const QZ_CAT = { tone:'聲調', eng:'ㄣ／ㄥ', an:'ㄢ／ㄤ', ld:'ㄌ／ㄉ／ㄋ', fh:'ㄈ／ㄏ', zh:'ㄓㄔㄕ／ㄗㄘㄙ（翹舌）', bp:'ㄅ／ㄆ', dt:'ㄉ／ㄊ', gk:'ㄍ／ㄎ', yu:'ㄧ／ㄩ' };
const QZ_PER = 20, QZ_HP = 5;

// ---------- 做錯的選項：把一個音節改一個地方 ----------
const TONES = ['', 'ˊ', 'ˇ', 'ˋ'];
function sylParse(s){ const neu = s.startsWith('˙'), b = neu ? s.slice(1) : s, t = TONES.includes(b.slice(-1)) && b.slice(-1) ? b.slice(-1) : ''; return { neu, base:t ? b.slice(0, -1) : b, t }; }
const sylJoin = p => (p.neu ? '˙' : '') + p.base + (p.neu ? '' : p.t);
const SWAP = { zh:{ 'ㄓ':'ㄗ', 'ㄗ':'ㄓ', 'ㄔ':'ㄘ', 'ㄘ':'ㄔ', 'ㄕ':'ㄙ', 'ㄙ':'ㄕ' }, bp:{ 'ㄅ':'ㄆ', 'ㄆ':'ㄅ' }, dt:{ 'ㄉ':'ㄊ', 'ㄊ':'ㄉ' }, gk:{ 'ㄍ':'ㄎ', 'ㄎ':'ㄍ' } };
function mutateSyl(p, cat){
  const b = p.base, out = [];
  const withBase = nb => ({ ...p, base:nb });
  if (cat === 'tone'){ if (!p.neu) TONES.filter(t => t !== p.t).forEach(t => out.push({ ...p, t })); }
  else if (cat === 'eng'){ if (/[ㄣㄥ]$/.test(b)) out.push(withBase(b.slice(0, -1) + (b.endsWith('ㄣ') ? 'ㄥ' : 'ㄣ'))); }
  else if (cat === 'an'){ if (/[ㄢㄤ]$/.test(b)) out.push(withBase(b.slice(0, -1) + (b.endsWith('ㄢ') ? 'ㄤ' : 'ㄢ'))); }
  else if (cat === 'ld'){ const i = b[0]; if (i === 'ㄌ'){ out.push(withBase('ㄉ' + b.slice(1)), withBase('ㄋ' + b.slice(1))); } else if (i === 'ㄉ' || i === 'ㄋ') out.push(withBase('ㄌ' + b.slice(1))); }
  else if (cat === 'fh'){
    if (b[0] === 'ㄈ') out.push(withBase('ㄏ' + (b[1] === 'ㄨ' ? '' : 'ㄨ') + b.slice(1)));
    else if (b.startsWith('ㄏㄨ') && b.length > 2) out.push(withBase('ㄈ' + b.slice(2)));
    else if (b === 'ㄏㄨ') out.push(withBase('ㄈㄨ'));
    else if (b[0] === 'ㄏ') out.push(withBase('ㄈ' + b.slice(1)));
  }
  else if (cat === 'yu'){   // 只換成真的有的音：（ㄐㄑㄒ）＋ㄧ／ㄩ＋（ㄝㄢㄣㄥ）
    const m = b.match(/^([ㄐㄑㄒ]?)([ㄧㄩ])([ㄝㄢㄣㄥ]?)$/);
    if (m) out.push(withBase(m[1] + (m[2] === 'ㄧ' ? 'ㄩ' : 'ㄧ') + m[3]));
  }
  else if (SWAP[cat] && SWAP[cat][b[0]]) out.push(withBase(SWAP[cat][b[0]] + b.slice(1)));
  return out;
}
// 這個詞在某一種易錯點上可以做出哪些錯的注音
function variants(word, cat){
  const syl = word.z.split(' '), res = [];
  syl.forEach((s, i) => mutateSyl(sylParse(s), cat).forEach(m => { const v = syl.slice(); v[i] = sylJoin(m); const z = v.join(' '); if (z !== word.z) res.push(z); }));
  return [...new Set(res)];
}
function makeOptions(word, n){
  const picked = [], seen = new Set([word.z]);
  const tryCats = [...shuffle(word.cats.slice()), ...shuffle(Object.keys(QZ_CAT).filter(c => !word.cats.includes(c)))];
  for (const c of tryCats){
    if (picked.length >= n - 1) break;
    const vs = shuffle(variants(word, c)).filter(v => !seen.has(v));
    if (vs.length){ picked.push({ z:vs[0], cat:c }); seen.add(vs[0]); }
  }
  // 還不夠就再從聲調補
  while (picked.length < n - 1){ const vs = shuffle(variants(word, 'tone')).filter(v => !seen.has(v)); if (!vs.length) break; picked.push({ z:vs[0], cat:'tone' }); seen.add(vs[0]); }
  return shuffle([{ z:word.z, ok:true }, ...picked]);
}

// ---------- 存檔：關卡進度＋給家長看的錯題紀錄 ----------
const QZ_KEY = 'bpm-quiz-v1';
let QZS = { stage:1, seen:[], log:{ asked:0, firstRight:0, wrong:0, cats:{}, words:{}, recent:[] } };
try { const s = JSON.parse(localStorage.getItem(QZ_KEY) || 'null'); if (s && s.log) QZS = { ...QZS, ...s, log:{ ...QZS.log, ...s.log } }; } catch (e) {}
const qzSave = () => { try { localStorage.setItem(QZ_KEY, JSON.stringify(QZS)); } catch (e) {} };
function logWrong(word, pick){
  const L2 = QZS.log; L2.wrong++;
  L2.cats[pick.cat] = (L2.cats[pick.cat] || 0) + 1;
  const w = L2.words[word.h] || (L2.words[word.h] = { e:word.e, z:word.z, n:0, picks:{} });
  w.n++; w.picks[pick.z] = (w.picks[pick.z] || 0) + 1; w.last = Date.now();
  L2.recent.unshift({ t:Date.now(), h:word.h, e:word.e, z:word.z, pick:pick.z, cat:pick.cat });
  L2.recent = L2.recent.slice(0, 40);
  qzSave();
}

let QZ = null, qzTimer = null;
const qzEl = () => $('stage');

// fx：'lost' 扣掉的那顆（剛碎掉）、'gain' 剛補回來的那顆
const heartsHtml = (hp, fx) => Array.from({ length:QZ_HP }, (_, i) => {
  const lost = fx === 'lost' && i === hp, gain = fx === 'gain' && i === hp - 1;
  return `<span class="qz-heart ${i < hp ? '' : 'off'} ${lost ? 'lost' : ''} ${gain ? 'gain' : ''}">${i < hp ? '❤️' : lost ? '💔' : '🤍'}</span>`;
}).join('');
const stepsHtml = done => Array.from({ length:QZ_PER }, (_, i) => i < done ? '<i class="qz-step on">★</i>' : '<i class="qz-step"></i>').join('');

  clearTimeout(qzTimer); QZ = null;

    <div class="qz-row"><button class="btn" data-qz="start" data-focus>${Z('ㄉㄧˋ', '第')} ${n} ${Z('ㄍㄨㄢ', '關')} ${Z('ㄎㄞ ㄕˇ', '開始')} ▶</button></div>

const focusFirst = () => setTimeout(() => { const f = qzEl().querySelector('[data-focus]') || qzEl().querySelector('button'); if (f) f.focus({ preventScroll:true }); }, 30);
// 一關 20 題：以前錯過的詞優先複習（最多 6 個），其他挑還沒考過的
function qzStart(){
  const n = QZS.stage, missed = Object.keys(QZS.log.words).filter(h => QZS.log.words[h].n > 0);
  const byH = h => QZ_WORDS.find(w => w.h === h);
  let pool = QZ_WORDS.filter(w => !QZS.seen.includes(w.h));
  if (pool.length < QZ_PER){ QZS.seen = []; pool = QZ_WORDS.slice(); }
  const review = shuffle(missed.map(byH).filter(Boolean)).slice(0, 6);
  const list = [...review, ...shuffle(pool.filter(w => !review.includes(w)))].slice(0, QZ_PER);
  QZ = { n, list:shuffle(list), i:0, hp:QZ_HP, wrong:0, streak:0, missed:[], nOpt:n <= 2 ? 2 : 3, busy:false };
  SFX.blip(); qzQuestion();
}
function qzQuestion(){
  const w = QZ.list[QZ.i];
  QZ.opts = makeOptions(w, QZ.nOpt); QZ.tried = false; QZ.busy = false;
  const pct = QZ.i / QZ_PER * 100;
  qzEl().innerHTML = `<div class="qz-top">
      <div class="qz-track"><div class="qz-done" style="width:${pct}%"></div><div class="qz-steps">${stepsHtml(QZ.i)}</div><img class="qz-me" src="${WALKER}" alt="" style="left:${pct}%"><span class="qz-flag">🎁</span></div>
      <div class="qz-stat"><span class="qz-no">${Z('ㄉㄧˋ', '第')}${QZ.n}${Z('ㄍㄨㄢ', '關')} ${QZ.i + 1}/${QZ_PER}</span><span class="qz-hp">${heartsHtml(QZ.hp)}</span></div>
    </div>
    <div class="qz-q">
      <div class="qz-card"><img class="qz-pic" src="${picUrl(w.e)}" alt="${esc(w.h)}"><div class="qz-han">${esc(w.h)}</div></div>
      <div class="qz-ask">${Z('ㄋㄚˇ ㄧ ˙ㄍㄜ ㄓㄨˋ ㄧㄣ ㄕˋ ㄉㄨㄟˋ ˙ㄉㄜ？', '哪一個注音是對的？')}</div>
    </div>
    <div class="qz-opts n${QZ.opts.length}">${QZ.opts.map((o, k) => `<button class="qz-opt s${o.z.split(' ').length}" data-opt="${k}"><span class="qz-k">${k + 1}</span><span class="qz-zy">${Z(o.z, false)}</span></button>`).join('')}</div>
    <div class="qz-fb" id="qzFb"></div>`;
  focusFirst();
}
function qzAnswer(k){
  if (!QZ || QZ.busy) return;
  const o = QZ.opts[k], btn = qzEl().querySelector(`[data-opt="${k}"]`), w = QZ.list[QZ.i];
  if (!o || !btn || btn.disabled) return;
  if (o.ok){
    QZ.busy = true; btn.classList.add('ok'); SFX.ok();
    if (!QZ.tried) QZS.log.firstRight++;
    QZS.log.asked++; if (!QZS.seen.includes(w.h)) QZS.seen.push(w.h); qzSave();
    // 連續三題第一次就答對，才補一顆愛心（答錯扣掉的不會馬上補回來）
    QZ.streak = QZ.tried ? 0 : QZ.streak + 1;
    const heal = QZ.streak >= 3 && QZ.hp < QZ_HP;
    if (heal){ QZ.hp++; QZ.streak = 0; }
    $('qzFb').innerHTML = `<span class="ok">✅ ${Z('ㄉㄚˊ ㄉㄨㄟˋ ˙ㄌㄜ！', '答對了！')}</span>`;
    qzEl().querySelector('.qz-hp').innerHTML = heartsHtml(QZ.hp, heal ? 'gain' : '');
    qzEl().querySelector('.qz-steps').innerHTML = stepsHtml(QZ.i + 1);
    const pct = (QZ.i + 1) / QZ_PER * 100;   // 往前走一步
    qzEl().querySelector('.qz-me').style.left = pct + '%'; qzEl().querySelector('.qz-done').style.width = pct + '%';
    setTimeout(() => speak(w.h), 350);   // 唸出正確的詞，家長在旁邊聽得到
    qzTimer = setTimeout(() => { QZ.i++; if (QZ.i >= QZ_PER) qzClear(); else qzQuestion(); }, 1500);
  } else {
    QZ.tried = true; QZ.wrong++; QZ.streak = 0; btn.classList.add('no'); btn.disabled = true; SFX.no();
    if (!QZ.missed.some(m => m.w === w)) QZ.missed.push({ w, pick:o.z });
    logWrong(w, o);
    QZ.hp--;   // 答錯扣一顆愛心
    qzEl().querySelector('.qz-hp').innerHTML = heartsHtml(QZ.hp, 'lost');
    $('qzFb').innerHTML = `<span class="no">💔 ${Z('ㄎㄡˋ ㄧ ㄎㄜ ㄞˋ ㄒㄧㄣ，ㄗㄞˋ ㄒㄧㄤˇ ㄧ ㄒㄧㄤˇ', '扣一顆愛心，再想一想')}</span>`;
    if (QZ.hp <= 0){ QZ.busy = true; qzTimer = setTimeout(qzFail, 900); }
  }
}
const missList = list => list.length ? `<ul class="qz-miss">${list.map(m => `<li><img src="${picUrl(m.w.e)}" alt=""><b>${esc(m.w.h)}</b><span class="good">${Z(m.w.z, false)}</span><span class="bad">${Z(m.pick, false)}</span></li>`).join('')}</ul>` : '';
function qzClear(){
  const stars = QZ.wrong === 0 ? 3 : QZ.wrong <= 3 ? 2 : 1;
  QZS.stage = Math.max(QZS.stage, QZ.n + 1); qzSave();
  SFX.clear(); setTimeout(() => speak('過關了！'), 900);
  qzEl().innerHTML = `<div class="qz-panel">
    <div class="qz-title">🎉 ${Z('ㄍㄨㄛˋ ㄍㄨㄢ ˙ㄌㄜ！', '過關了！')}</div>
    <div class="stars">${starsHtml(stars)}</div>
    <div class="qz-say">${QZ.wrong ? `${Z('ㄗㄨㄛˋ ㄘㄨㄛˋ', '做錯')} ${QZ.wrong} ${Z('ㄘˋ', '次')}` : Z('ㄑㄩㄢˊ ㄅㄨˋ ㄉㄚˊ ㄉㄨㄟˋ！', '全部答對！')}</div>
    ${QZ.missed.length ? `<div class="qz-sub">這一關要再加強（左邊是對的，右邊是選錯的）</div>${missList(QZ.missed)}` : ''}
    <div class="qz-row"><button class="btn" data-qz="start" data-focus>${Z('ㄒㄧㄚˋ ㄧ ㄍㄨㄢ', '下一關')} ▶</button><button class="btn alt" data-qz="parent">👪 家長紀錄</button><button class="btn alt" data-qz="home">🏠 ${Z('ㄏㄨㄟˊ ㄕㄡˇ ㄧㄝˋ', '回首頁')}</button></div>
  </div>`;
  focusFirst();
}
// 愛心扣光：顯示「再接再厲」，過一下就跳出遊戲回到首頁（這一關的錯題已經記在家長紀錄裡）
function qzFail(){
  SFX.no(); QZ = null;
  qzEl().innerHTML = `<div class="qz-panel">
    <div class="qz-title">💪 ${Z('ㄗㄞˋ ㄐㄧㄝ ㄗㄞˋ ㄌㄧˋ', '再接再厲')}</div>
    <div class="qz-say">${Z('ㄞˋ ㄒㄧㄣ ㄎㄡˋ ㄍㄨㄤ ˙ㄌㄜ', '愛心扣光了')}</div>
  </div>`;
  setTimeout(() => speak('再接再厲'), 500);
  qzTimer = setTimeout(qzHome, 3000);
}
// 家長紀錄：哪一種易錯點錯最多、哪些詞常選錯、最近錯的題目
function qzParent(){
  clearTimeout(qzTimer); QZ = null;
  const L2 = QZS.log, cats = Object.entries(L2.cats).sort((a, b) => b[1] - a[1]), max = cats.length ? cats[0][1] : 1;
  const words = Object.entries(L2.words).sort((a, b) => b[1].n - a[1].n).slice(0, 15);
  const rate = L2.asked ? Math.round(L2.firstRight / L2.asked * 100) : 0;
  const d = t => { const x = new Date(t); return `${x.getMonth() + 1}/${x.getDate()} ${String(x.getHours()).padStart(2, '0')}:${String(x.getMinutes()).padStart(2, '0')}`; };
  qzEl().innerHTML = `<div class="qz-panel qz-parent">
    <div class="qz-title">👪 家長紀錄</div>
    <div class="qz-sum"><span>已答 <b>${L2.asked}</b> 題</span><span>第一次就答對 <b>${rate}%</b></span><span>選錯 <b>${L2.wrong}</b> 次</span><span>目前第 <b>${QZS.stage}</b> 關</span></div>
    ${L2.wrong ? `
    <h4>最常錯的類型</h4>
    <ul class="qz-cats">${cats.map(([c, n]) => `<li><span class="nm">${QZ_CAT[c] || c}</span><span class="bar"><i style="width:${n / max * 100}%"></i></span><b>${n}</b></li>`).join('')}</ul>
    <h4>常選錯的詞（左邊是對的，右邊是孩子選的）</h4>
    <ul class="qz-miss">${words.map(([h, w]) => `<li><img src="${picUrl(w.e)}" alt=""><b>${esc(h)}</b><span class="good">${Z(w.z, false)}</span><span class="bad">${Object.keys(w.picks).map(p => Z(p, false)).join('<i class="sep">、</i>')}</span><span class="cnt">${w.n} 次</span></li>`).join('')}</ul>
    <h4>最近選錯的題目</h4>
    <ul class="qz-recent">${L2.recent.slice(0, 12).map(r => `<li><span class="t">${d(r.t)}</span><b>${esc(r.h)}</b><span class="good">${Z(r.z, false)}</span>→<span class="bad">${Z(r.pick, false)}</span><span class="c">${QZ_CAT[r.cat] || ''}</span></li>`).join('')}</ul>`
    : '<p class="qz-empty">還沒有錯題紀錄。孩子玩過以後，這裡會列出最常錯的類型和詞。</p>'}
    <p class="qz-note">紀錄只存在這台裝置的瀏覽器裡（換手機或電腦就看不到）。之後每一關開始時，會優先複習以前選錯的詞，最多 6 個。</p>
    <div class="qz-row"><button class="btn" data-qz="home" data-focus>◀ 返回</button>${L2.asked ? '<button class="btn alt" data-qz="clear">🗑️ 清除紀錄</button>' : ''}</div>
  </div>`;
  qzEl().scrollTop = 0;
  focusFirst();
}
function qzClick(e){
  const o = e.target.closest('[data-opt]'); if (o){ qzAnswer(+o.dataset.opt); return; }
  const b = e.target.closest('[data-qz]'); if (!b) return;
  const a = b.dataset.qz;
  if (a === 'start') qzStart();
  else if (a === 'parent'){ SFX.blip(); qzParent(); }
  else if (a === 'home'){ SFX.blip(); qzHome(); }
  else if (a === 'clear'){
    if (!b.dataset.sure){ b.dataset.sure = '1'; b.textContent = '⚠️ 再按一次，確定清除'; return; }
    QZS = { stage:1, seen:[], log:{ asked:0, firstRight:0, wrong:0, cats:{}, words:{}, recent:[] } }; qzSave(); qzParent();
  }
}

/* ================= 說明、開關、開始 ================= */
const HELP_KID = [
  ['🖼️', 'ㄎㄢˋ ㄊㄨˊ ㄏㄜˊ ㄗˋ', '看圖和字'],
  ['👆', 'ㄉㄧㄢˇ ㄉㄨㄟˋ ˙ㄉㄜ ㄓㄨˋ ㄧㄣ', '點對的注音'],
  ['💔', 'ㄉㄚˊ ㄘㄨㄛˋ ㄎㄡˋ ㄧ ㄎㄜ ㄞˋ ㄒㄧㄣ', '答錯扣一顆愛心'],
  ['❤️', 'ㄌㄧㄢˊ ㄉㄨㄟˋ ㄙㄢ ㄊㄧˊ ㄅㄨˇ ㄧ ㄎㄜ', '連對三題補一顆'],
  ['🚩', 'ㄗㄡˇ ㄉㄠˋ ㄑㄧˊ ˙ㄗ ㄐㄧㄡˋ ㄍㄨㄛˋ ㄍㄨㄢ', '走到旗子就過關']];
const HELP_PARENT = '畫面中間會出現一個東西或動作的像素圖和國字，下面有 2～3 個注音，孩子要選出正確的那一個（第 1、2 關兩個選項，第 3 關起三個；電腦也可以按 1～3）。題庫有 108 個一年級常用詞，錯的選項專門考容易混淆的地方：聲調、ㄣ／ㄥ、ㄢ／ㄤ、ㄌ／ㄉ／ㄋ、ㄈ／ㄏ、翹舌 ㄓㄔㄕ／ㄗㄘㄙ、ㄅ／ㄆ、ㄉ／ㄊ、ㄍ／ㄎ、ㄧ／ㄩ。上方是前進的路和 5 顆愛心：答對會有「叮叮叮」的音效、電腦會唸出這個詞，小朋友往前走一步；答錯會有低沉的「嗶嗶」聲並扣一顆心，可以再選到對為止，但扣掉的心不會因為選對就補回來，連續三題第一次就答對才補一顆。家長不用在旁邊，聽聲音就知道孩子答得對不對。20 題走到旗子就過關，愛心用完會顯示「再接再厲」，接著跳出遊戲回到首頁，要重新開始這一關。每一關結束會列出這一關選錯的詞；「家長紀錄」統計最常錯的類型、常選錯的詞（對的注音和孩子選的注音對照）和最近的錯題，之後每一關也會優先複習以前錯過的詞。唸詞用的是裝置內建的中文語音，有些電腦沒有中文語音，就只會有音效。';
function openHelp(){
  SFX.blip();
  $('modal').innerHTML = `<div class="qz-panel">
    <div class="qz-title">📖 ${Z('ㄧㄡˊ ㄒㄧˋ ㄕㄨㄛ ㄇㄧㄥˊ', '遊戲說明')}</div>
    <ul class="help-list">${HELP_KID.map(([ico, z, h]) => `<li><span class="ico">${ico}</span><span>${Z(z, h)}</span></li>`).join('')}</ul>
    <div class="parent"><h3>給家長</h3><p>${HELP_PARENT}</p></div>
    <div class="qz-row"><button class="btn" data-close>${Z('ㄨㄛˇ ㄓ ㄉㄠˋ ˙ㄌㄜ', '我知道了')}</button></div>
  </div>`;
  $('modal').hidden = false;
  setTimeout(() => $('modal').querySelector('[data-close]').focus(), 30);
}
const closeHelp = () => { $('modal').hidden = true; $('btnHelp').focus(); };
$('modal').addEventListener('click', e => { if (e.target === $('modal') || e.target.closest('[data-close]')) closeHelp(); });
$('btnHelp').onclick = openHelp;
const toggle = (btn, on) => btn.setAttribute('aria-pressed', String(on));
$('btnSnd').onclick = () => { muted = !muted; toggle($('btnSnd'), !muted); if (!muted) SFX.blip(); };
$('btnVoice').onclick = () => { voiceOn = !voiceOn; toggle($('btnVoice'), voiceOn); if (voiceOn) speak('注音'); else if (canSpeak) speechSynthesis.cancel(); };
if (!canSpeak) $('btnVoice').hidden = true;
$('stage').addEventListener('click', e => { audio(); qzClick(e); });
addEventListener('keydown', e => {
  if (!$('modal').hidden){ if (e.key === 'Escape') closeHelp(); return; }
  if (QZ && /^[1-3]$/.test(e.key)){ e.preventDefault(); qzAnswer(+e.key - 1); }
});
$('logoText').innerHTML = Z('ㄓㄨˋ ㄧㄣ ㄉㄚˋ ㄊㄧㄠˇ ㄓㄢˋ', '注音大挑戰');
qzHome();
</script>
