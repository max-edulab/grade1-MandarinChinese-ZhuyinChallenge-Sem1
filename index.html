<meta name="edulab:icon" content="📝">
<meta name="description" content="看圖選出正確的注音，專門練習容易混淆的聲調和音；答對會唸出詞，還有給家長看的錯題紀錄。">
<title>注音大挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* 版面：一台像素遊戲機——上方標題列＋開關，下面一塊天空和草地的舞台，題目、選項都在舞台裡。故意只有一種白天的配色。 */
:root{
  --sky:#5c94fc; --sky2:#8fd0ff; --grass:#5cb03c; --grass2:#7ccc4c;
  --ink:#1b1b2f; --paper:#fffbe8; --brick:#c84c0c; --gold:#fcbc3c; --leaf:#2f8a1e; --red:#c8283c; --muted:#6a6a80;
  --ok-bg:#c8f4b0; --no-bg:#ffd0d0; --white:#ffffff;
  --f-zy:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --f-px:"Press Start 2P",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-zy);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit}
.wrap{max-width:1000px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
/* 標題列 */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{margin:0;font-size:24px;font-weight:900;color:var(--white);text-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;gap:8px}
.logo .px{font-family:var(--f-px);font-size:12px;color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-weight:900;font-size:14px;background:var(--white);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:3px 10px;cursor:pointer;text-decoration:none}
.chip[aria-pressed="true"]{background:var(--gold)}
.chip:active{transform:translateY(3px);box-shadow:none}
.chip:focus-visible,.btn:focus-visible,.qz-opt:focus-visible{outline:3px solid var(--white);outline-offset:2px}
/* 舞台 */
.stage{position:relative;flex:1;min-height:420px;display:flex;flex-direction:column;gap:10px;padding:12px 16px;overflow:auto;
  border:4px solid var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.25);
  background:linear-gradient(var(--sky2) 0 62%,var(--grass2) 62% 64%,var(--grass) 64%)}

/* 直式注音（跟ㄅㄆㄇ心愛小鎮一樣的寫法） */
.sy{display:inline-flex;align-items:flex-end;vertical-align:middle;margin:.1em .1em;padding-right:.36em;line-height:1}
.sy .col{display:inline-flex;flex-direction:column;align-items:center}
.sy b{position:relative;display:block;font-weight:inherit;font-size:.62em;line-height:1.04}
.sy .dot{display:block;font-style:normal;font-size:.55em;line-height:.55}
.sy .tn{position:absolute;left:100%;top:-.12em;margin-left:.02em;font-style:normal;font-size:.8em;line-height:1}
.sy.m .tn{top:-.5em}
.pu{display:inline-block;vertical-align:middle;margin-inline:.05em}
.ru{display:inline-flex;align-items:center;vertical-align:middle;margin:.06em .04em}
.ru .hz{display:block;line-height:1.1}
.ru .sy{font-size:.44em;margin:0 0 0 .1em}
.ru .sy b{font-size:1em;line-height:1.08}
.ru .sy .dot{font-size:.7em}

/* 按鈕 */
.btn{font-weight:900;font-size:22px;color:var(--white);background:var(--brick);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:8px 20px;cursor:pointer}
.btn.alt{background:var(--white);color:var(--ink);font-size:18px}
.btn:active{transform:translateY(5px);box-shadow:none}
.stars{font-size:40px;letter-spacing:6px;color:var(--gold);-webkit-text-stroke:2px var(--ink)}
.stars .off{color:#d8d4c0}

/* 題目畫面 */
.qz-top{display:flex;align-items:center;gap:12px;flex:none}
.qz-track{position:relative;flex:1;height:38px;margin-top:14px;border:4px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.25);
  background:repeating-linear-gradient(-45deg,#ffe3ef 0 10px,#fff6c8 10px 20px)}
.qz-done{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:repeating-linear-gradient(-45deg,#ffb3d1 0 10px,#ffd76a 10px 20px);transition:width .5s steps(5)}
.qz-steps{position:absolute;left:14px;right:40px;top:50%;translate:0 -50%;display:flex;justify-content:space-between;align-items:center}
.qz-step{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #c8a0b8}
.qz-step.can{width:18px;height:18px;border:0;border-radius:0;background:none;image-rendering:pixelated;animation:qzPop .4s steps(4)}
.qz-step.x{width:auto;height:auto;border:0;background:none;font-style:normal;font-weight:900;font-size:15px;line-height:1;color:#e83838;text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.qz-step.on{width:auto;height:auto;border:0;background:none;font-size:13px;line-height:1;color:#f0a000;text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.qz-me{position:absolute;bottom:14px;width:40px;height:46px;max-width:none;translate:-50% 0;image-rendering:pixelated;image-rendering:crisp-edges;transition:left .5s steps(5);animation:qzHop .8s steps(2) infinite}
.qz-flag{position:absolute;right:-6px;top:50%;translate:0 -58%;font-size:30px;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.25))}
@keyframes qzHop{50%{transform:translateY(-5px)}}
/* 愛心：扣掉的那顆會碎掉、抖一抖；補回來的那顆會跳一下 */
.qz-heart{display:inline-block}
.qz-heart.lost{animation:qzLose .7s steps(4)}
.qz-heart.gain{animation:qzGain .5s steps(4)}
@keyframes qzLose{0%{transform:scale(1.6)}30%{transform:scale(1.6) rotate(-15deg)}60%{transform:scale(1.3) rotate(15deg)}100%{transform:scale(1)}}
@keyframes qzGain{0%{transform:scale(.4)}70%{transform:scale(1.5)}100%{transform:scale(1)}}
.qz-stat{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.qz-no{font-weight:900;font-size:18px;background:var(--paper);border:3px solid var(--ink);padding:0 8px}
.qz-hp{display:flex;gap:2px;font-size:24px}
.qz-heart.off{opacity:.55}
.qz-q{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.qz-card{display:flex;align-items:center;gap:18px;background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.25);padding:10px 24px}
.qz-pic{width:clamp(64px,13vh,140px);height:clamp(64px,13vh,140px);image-rendering:pixelated;image-rendering:crisp-edges}
.qz-han{font-size:clamp(32px,7vh,68px);font-weight:900;letter-spacing:.06em;color:var(--ink);white-space:nowrap}
.qz-ask{font-weight:900;font-size:20px;background:rgba(255,255,255,.8);border:3px solid var(--ink);padding:2px 12px}
/* 答案框：固定大小（放得下三個字的注音），置中排列，換題目不會跳動 */
.qz-opts{flex:none;display:flex;justify-content:center;gap:18px}
.qz-opt{position:relative;display:flex;align-items:center;justify-content:center;min-height:clamp(80px,16vh,130px);background:var(--white);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;color:var(--ink);font-weight:900;font-size:clamp(34px,7vh,60px);padding:6px;white-space:nowrap}
@media (hover:hover){.qz-opt:hover:not(:disabled){background:#fff3b0}}
.qz-opt:active:not(:disabled){transform:translateY(5px);box-shadow:none}
.qz-opt.ok{background:var(--ok-bg);border-color:var(--leaf)}
.qz-opt.no{background:var(--no-bg);opacity:.75;animation:qzShake .3s steps(3)}
.qz-opt:disabled{cursor:default}
/* 注音一個音節一行，上下排列 */
.qz-zy{display:flex;flex-direction:column;align-items:center;gap:.24em}
.qz-zy .sy{margin:0;padding-right:.36em}
.qz-opt{--oh:clamp(140px,27vh,232px);flex:0 1 calc(var(--oh) * .69);min-width:0;width:calc(var(--oh) * .69);height:var(--oh);min-height:0;padding:8px 4px;font-size:calc(var(--oh) * .146)}
.qz-k{position:absolute;left:6px;top:4px;font-family:var(--f-px);font-size:10px;color:#9a9ab0}
@keyframes qzShake{0%,100%{translate:0}33%{translate:-6px}66%{translate:6px}}
.qz-fb{flex:none;min-height:32px;text-align:center;font-weight:900;font-size:22px}
.qz-fb .ok{color:var(--white);background:var(--leaf);border:3px solid var(--ink);padding:1px 12px}
.qz-fb .no{color:var(--white);background:var(--red);border:3px solid var(--ink);padding:1px 12px}

/* 開始、過關、家長紀錄的面板 */
.qz-panel{margin:auto;width:min(660px,100%);background:var(--paper);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 6px var(--gold),8px 8px 0 rgba(0,0,0,.25);padding:20px 22px;text-align:center;display:flex;flex-direction:column;gap:12px}
.qz-title{font-size:32px;font-weight:900;color:var(--brick);text-wrap:balance}
.qz-say{font-size:24px;font-weight:900}
.qz-sub{font-size:15px;font-weight:700;color:var(--muted)}
.qz-rules{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.qz-rules > span{background:var(--white);border:3px solid var(--ink);padding:2px 10px;font-weight:900;font-size:18px}
.qz-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.qz-miss,.qz-recent,.qz-cats{list-style:none;margin:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px}
.qz-miss li{display:flex;align-items:center;gap:10px;background:var(--white);border:2px solid var(--ink);padding:4px 10px;font-size:22px;flex-wrap:wrap}
.qz-miss img{width:32px;height:32px;image-rendering:pixelated}
.qz-miss b{font-size:20px;min-width:3.4em}
.good{color:#1f6a1a;background:#e4f8d8;padding:0 6px}
.bad{color:#b01c30;background:#ffe4e8;padding:0 6px}
.qz-miss .cnt{margin-left:auto;font-size:14px;font-weight:700;color:var(--muted)}
.qz-miss .sep{font-style:normal;color:var(--muted)}
.qz-parent{text-align:left}
.qz-parent .qz-title{text-align:center}
.qz-parent h4{margin:8px 0 0;font-size:16px}
.qz-sum{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.qz-sum > span{background:var(--white);border:2px solid var(--ink);padding:2px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.qz-sum b{color:var(--brick);font-size:1.15em}
.qz-cats li{display:grid;grid-template-columns:minmax(120px,auto) 1fr 30px;align-items:center;gap:8px;font-weight:700;font-variant-numeric:tabular-nums}
.qz-cats .bar{height:14px;background:#eee8d4;border:2px solid var(--ink)}
.qz-cats .bar i{display:block;height:100%;background:#e8705a}
.qz-recent li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:18px;border-bottom:2px dashed #d8d2b8;padding-bottom:4px}
.qz-recent .t{font-size:13px;color:var(--muted);min-width:5.5em;font-variant-numeric:tabular-nums}
.qz-recent .c{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
.qz-note,.qz-empty{font-size:14px;color:var(--muted);margin:4px 0 0}

/* 開始畫面：難度、題數 */
.qz-pick{display:flex;align-items:stretch;justify-content:center;gap:8px;flex-wrap:wrap}
.qz-pick .lab{align-self:center;font-weight:900;font-size:20px;min-width:3em}
.seg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:5.6em;background:var(--white);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:6px 12px;cursor:pointer;font-weight:900;font-size:22px}
.seg small{font-size:14px;color:var(--muted)}
.seg.on{background:var(--gold)}
.seg .mul{font-size:13px;line-height:1;background:var(--red);color:var(--white);border:2px solid var(--ink);padding:2px 5px;white-space:nowrap}
.seg.on small{color:var(--ink)}
.seg:active{transform:translateY(4px);box-shadow:none}
.seg:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
.qz-slot{width:30px;height:30px;image-rendering:pixelated;image-rendering:crisp-edges;filter:grayscale(1) brightness(1.6) opacity(.35)}
.qz-slot.on{filter:none}
.qz-slot.pop{animation:qzPop .5s steps(4)}
.qz-can{display:inline-flex;align-items:center;gap:2px;font-family:var(--f-px);font-size:14px;background:var(--paper);border:3px solid var(--ink);padding:1px 8px 1px 2px}
.qz-can img{width:26px;height:26px;image-rendering:pixelated}
.qz-can.pop{animation:qzPop .4s steps(4)}
@keyframes qzPop{50%{transform:scale(1.35)}}
.qz-mine{display:flex;align-items:center;gap:12px;width:100%}
.qz-mine .qz-can{flex:none}
/* 你和寵物排成一列往左走，走出左邊再從右邊出來；不換行 */
.qz-party{flex:1;min-width:0;height:56px;position:relative;overflow:hidden}
.qz-party .lane{position:absolute;left:0;bottom:2px;display:flex;align-items:flex-end;animation:qzParade var(--t,10s) linear infinite}
.qz-party .grp{flex:none;display:flex;align-items:flex-end;gap:2px}
.qz-party img{height:40px;width:auto;max-width:none;image-rendering:pixelated;animation:qzHop .8s steps(2) infinite}
.qz-party img.pet{width:48px;height:40px}
.qz-party img.me{width:44px;height:50px;scale:-1 1}
@keyframes qzParade{from{transform:translateX(0)}to{transform:translateX(calc(-1 * var(--p,300px)))}}
@media (prefers-reduced-motion:reduce){.qz-party .lane{animation:none}}
/* 農場 */
.farm{position:relative;margin:auto;width:min(860px,100%);display:flex;flex-direction:column;gap:10px}
/* 問要不要餵跟著的動物 */
.farm-ask{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:5;width:min(340px,92%);display:flex;flex-direction:column;align-items:center;gap:8px;
  background:var(--paper);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 6px var(--gold),6px 6px 0 rgba(0,0,0,.3);padding:14px 16px}
.farm-ask .who{display:flex;align-items:center;gap:10px;font-size:24px}
.farm-ask .who img{width:72px;height:60px;image-rendering:pixelated}
.farm-ask .hpbar{width:100%;height:18px;background:var(--white);border:3px solid var(--ink)}
.farm-ask .hpbar i{display:block;height:100%}
.farm-ask .steps{font-weight:700;font-size:17px}
.farm-ask .steps .n{font-family:var(--f-px);font-size:14px;color:var(--brick)}
.farm-ask .q{font-weight:900;font-size:22px}
.farm-res{align-self:center;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;font-weight:900;font-size:22px;background:var(--paper);border:4px solid var(--ink);padding:4px 14px}
.farm-res .sm{font-size:15px;color:var(--muted)}
.farm-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.farm-head b{font-size:26px;color:var(--white);text-shadow:2px 2px 0 var(--ink)}
.farm-say{align-self:center;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-weight:900;font-size:20px;background:rgba(255,255,255,.85);border:3px solid var(--ink);padding:2px 12px;text-align:center}
.map-wrap{position:relative;align-self:center;display:flex;align-items:stretch;gap:4px;width:min(100%,calc((100vh - 300px) * 1.6 + 80px),940px)}
.map-wrap .farm-cv{flex:1;min-width:0;width:auto}
/* 地圖兩旁的直排牌子：地圖名稱、左右入口通到哪裡（放在地圖外面，不會蓋到能走的地方） */
.map-side{flex:none;position:relative;font-size:clamp(12px,1.6vw,16px);width:calc(1.7em + 10px)}
.map-side > span{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;font-weight:900;border:3px solid var(--ink);pointer-events:none;line-height:1.1}
.map-side .gate-lab{top:50%;translate:0 -50%;background:var(--paper)}
.map-side .map-name{top:0;color:var(--ink);background:var(--gold)}
.ct-time{font-family:var(--f-px);font-size:.9em}
.ct-time.hurry{color:var(--red)}
.ct-pad .btn{font-size:26px;min-width:110px;touch-action:none;user-select:none;-webkit-user-select:none}
#ctCv{touch-action:none}
.farm-block{position:absolute;inset:0;z-index:6;background:rgba(18,20,60,.45)}
.farm-cv{display:block;width:100%;max-width:100%;aspect-ratio:16/10;image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.25);cursor:pointer;touch-action:manipulation}
.farm-tip{align-self:center;font-weight:700;font-size:16px;background:rgba(255,255,255,.75);border:2px solid var(--ink);padding:1px 10px;text-align:center}
.farm-field{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:12px;border:4px solid var(--ink);
  background:#8a5a2c repeating-linear-gradient(90deg,transparent 0 46px,#6a4220 46px 50px);box-shadow:inset 0 0 0 6px #b07a40}
.animal{display:flex;flex-direction:column;align-items:center;gap:2px;background:#9ce07c;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:6px 4px;cursor:pointer;font-weight:900;font-size:22px}
@media (hover:hover){.animal:hover{background:#c8f4b0}}
.animal:active{transform:translateY(4px);box-shadow:none}
.animal img{width:64px;height:64px;image-rendering:pixelated}
.animal .pips{display:flex;gap:3px}
.animal .pips i{width:12px;height:12px;border:2px solid var(--ink);background:var(--white)}
.animal .pips i.on{background:var(--gold)}
.animal.munch img{animation:qzMunch .5s steps(4)}
.animal.full{animation:qzPop .5s steps(4) 2;background:var(--gold)}
@keyframes qzMunch{25%{transform:translateY(-6px)}50%{transform:translateY(0) scale(1.1)}75%{transform:translateY(-4px)}}
.farm-party{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.75);border:3px solid var(--ink);padding:6px 12px}
.farm-party .lab{font-weight:900;font-size:18px}
/* 說明視窗 */
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(18,20,60,.55)}
.modal .qz-panel{max-height:calc(100% - 8px);overflow:auto;text-align:left}
.help-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:22px;font-weight:700}
.help-list li{display:flex;align-items:center;gap:10px}
.help-list .ico{font-size:26px;width:1.3em;text-align:center}
.parent{background:var(--white);border:3px solid var(--ink);padding:10px 14px}
.parent h3{margin:0 0 4px;font-size:16px}
.parent p{margin:0;font-size:15px;line-height:1.7}

@media (max-width:640px){
  body{padding-block:8px}
  .logo{font-size:20px}
  .stage{padding:10px;gap:8px;min-height:480px}
  .qz-card{padding:8px 14px;gap:12px}
  .qz-han{font-size:36px}.qz-pic{width:84px;height:84px}
  .qz-opts{gap:8px}

<script>
/* ================= 工具：注音、音效、語音、像素圖 ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const starsHtml = n => [0, 1, 2].map(i => `<span class="${i < n ? '' : 'off'}">★</span>`).join('');
const INK = '#1b1b2f';
const BPM = /[ㄅ-ㄯ]/, TONE = /[ˊˇˋ]/, CJK = /[㐀-鿿]/;
// 注音（直式）；給國字就排成「國字＋注音」，只給注音就只顯示注音
const Z = (s, han) => {
  s = String(s);
  const chars = typeof han === 'string' ? [...han].filter(c => CJK.test(c)) : [];
  const toks = [];
  let dot = false, letters = '';
  const flush = tone => { if (letters || dot) toks.push({ dot, letters, tone }); letters = ''; dot = false; };
  for (const ch of s){
    if (/\s/.test(ch)){ flush(); continue; }
    if (ch === '˙'){ flush(); dot = true; continue; }
    if (BPM.test(ch)){ letters += ch; continue; }
    if (TONE.test(ch) && letters){ flush(ch); continue; }
    flush(); toks.push({ pu:ch });
  }
  flush();
  const nSy = toks.filter(t => !t.pu).length, pair = chars.length === nSy && nSy > 0;
  let k = 0;
  return toks.map(t => {
    if (t.pu) return `<span class="pu">${esc(t.pu)}</span>`;
    const sy = `<span class="sy${[...t.letters].length > 1 ? ' m' : ''}"><span class="col">${t.dot ? '<i class="dot">˙</i>' : ''}${[...t.letters].map((c, i, a) => `<b>${c}${t.tone && i === a.length - 1 ? `<i class="tn">${t.tone}</i>` : ''}</b>`).join('')}</span></span>`;
    return pair ? `<span class="ru"><span class="hz">${esc(chars[k++])}</span>${sy}</span>` : sy;
  }).join('');
};

let AC = null, muted = false, voiceOn = true;
function audio(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(f, d, type = 'square', v = .05, when = 0){
  if (muted) return; const a = audio(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03);
}
// 答對、答錯的聲音差很多，家長在旁邊用聽的就分得出來

  blip: () => beep(880, .05, 'square', .04),

  no:   () => { beep(220, .14, 'sawtooth', .05); beep(165, .24, 'sawtooth', .05, .14); },
  clear:() => [523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => beep(f, i === 6 ? .5 : .13, 'square', .05, i * .15))
};
const canSpeak = 'speechSynthesis' in window;
function speak(text){
  if (!canSpeak || !voiceOn) return;
  try {
    const s = window.speechSynthesis; s.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-TW'; u.rate = .8;
    const vs = s.getVoices(), v = vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang));
    if (v) u.voice = v;
    s.speak(u);
  } catch (e) {}
}
// emoji 變成 18×18 的像素圖（加一圈深色描邊）
function emojiSprite(e){
  const big = document.createElement('canvas'); big.width = big.height = 72;
  const bg = big.getContext('2d');
  bg.font = '44px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  bg.textAlign = 'center'; bg.textBaseline = 'middle';
  bg.fillText(e, 36, 38);
  const bd = bg.getImageData(0, 0, 72, 72).data;
  let x0 = 72, y0 = 72, x1 = -1, y1 = -1;
  for (let y = 0; y < 72; y++) for (let x = 0; x < 72; x++) if (bd[(y * 72 + x) * 4 + 3] > 40){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const c = document.createElement('canvas'); c.width = c.height = 18;
  const g = c.getContext('2d');
  if (x1 >= 0){
    const w = x1 - x0 + 1, h = y1 - y0 + 1, sc = Math.min(16 / w, 16 / h);
    g.imageSmoothingEnabled = true;
    g.drawImage(big, x0, y0, w, h, 1 + (16 - w * sc) / 2, 1 + (16 - h * sc) / 2, w * sc, h * sc);
  }
  const id = g.getImageData(0, 0, 18, 18), d = id.data;
  for (let i = 3; i < d.length; i += 4) d[i] = d[i] < 110 ? 0 : 255;
  g.putImageData(id, 0, 0);
  const op = i => d[i * 4 + 3] > 0, edge = [];
  for (let y = 0; y < 18; y++) for (let x = 0; x < 18; x++){
    const i = y * 18 + x; if (op(i)) continue;
    if ((x > 0 && op(i - 1)) || (x < 17 && op(i + 1)) || (y > 0 && op(i - 18)) || (y < 17 && op(i + 18))) edge.push(i);
  }
  g.fillStyle = INK; edge.forEach(i => g.fillRect(i % 18, Math.floor(i / 18), 1, 1));
  return c;
}

// ---------- 做錯的選項：把一個音節改一個地方 ----------
const TONES = ['', 'ˊ', 'ˇ', 'ˋ'];
function sylParse(s){ const neu = s.startsWith('˙'), b = neu ? s.slice(1) : s, t = TONES.includes(b.slice(-1)) && b.slice(-1) ? b.slice(-1) : ''; return { neu, base:t ? b.slice(0, -1) : b, t }; }
const sylJoin = p => (p.neu ? '˙' : '') + p.base + (p.neu ? '' : p.t);
const SWAP = { zh:{ 'ㄓ':'ㄗ', 'ㄗ':'ㄓ', 'ㄔ':'ㄘ', 'ㄘ':'ㄔ', 'ㄕ':'ㄙ', 'ㄙ':'ㄕ' }, bp:{ 'ㄅ':'ㄆ', 'ㄆ':'ㄅ' }, dt:{ 'ㄉ':'ㄊ', 'ㄊ':'ㄉ' }, gk:{ 'ㄍ':'ㄎ', 'ㄎ':'ㄍ' } };
function mutateSyl(p, cat){
  const b = p.base, out = [];
  const withBase = nb => ({ ...p, base:nb });
  if (cat === 'tone'){ if (!p.neu) TONES.filter(t => t !== p.t).forEach(t => out.push({ ...p, t })); }
  else if (cat === 'eng'){ if (/[ㄣㄥ]$/.test(b)) out.push(withBase(b.slice(0, -1) + (b.endsWith('ㄣ') ? 'ㄥ' : 'ㄣ'))); }
  else if (cat === 'an'){ if (/[ㄢㄤ]$/.test(b)) out.push(withBase(b.slice(0, -1) + (b.endsWith('ㄢ') ? 'ㄤ' : 'ㄢ'))); }
  else if (cat === 'ld'){ const i = b[0]; if (i === 'ㄌ'){ out.push(withBase('ㄉ' + b.slice(1)), withBase('ㄋ' + b.slice(1))); } else if (i === 'ㄉ' || i === 'ㄋ') out.push(withBase('ㄌ' + b.slice(1))); }
  else if (cat === 'fh'){
    if (b[0] === 'ㄈ') out.push(withBase('ㄏ' + (b[1] === 'ㄨ' ? '' : 'ㄨ') + b.slice(1)));
    else if (b.startsWith('ㄏㄨ') && b.length > 2) out.push(withBase('ㄈ' + b.slice(2)));
    else if (b === 'ㄏㄨ') out.push(withBase('ㄈㄨ'));
    else if (b[0] === 'ㄏ') out.push(withBase('ㄈ' + b.slice(1)));
  }
  else if (cat === 'yu'){   // 只換成真的有的音：（ㄐㄑㄒ）＋ㄧ／ㄩ＋（ㄝㄢㄣㄥ）
    const m = b.match(/^([ㄐㄑㄒ]?)([ㄧㄩ])([ㄝㄢㄣㄥ]?)$/);
    if (m) out.push(withBase(m[1] + (m[2] === 'ㄧ' ? 'ㄩ' : 'ㄧ') + m[3]));
  }
  else if (SWAP[cat] && SWAP[cat][b[0]]) out.push(withBase(SWAP[cat][b[0]] + b.slice(1)));
  return out;
}
// 這個詞在某一種易錯點上可以做出哪些錯的注音
function variants(word, cat){
  const syl = word.z.split(' '), res = [];
  syl.forEach((s, i) => mutateSyl(sylParse(s), cat).forEach(m => { const v = syl.slice(); v[i] = sylJoin(m); const z = v.join(' '); if (z !== word.z) res.push(z); }));
  return [...new Set(res)];
}
function makeOptions(word, n){
  const picked = [], seen = new Set([word.z]);
  const tryCats = [...shuffle(word.cats.slice()), ...shuffle(Object.keys(QZ_CAT).filter(c => !word.cats.includes(c)))];
  for (const c of tryCats){
    if (picked.length >= n - 1) break;
    const vs = shuffle(variants(word, c)).filter(v => !seen.has(v));
    if (vs.length){ picked.push({ z:vs[0], cat:c }); seen.add(vs[0]); }
  }
  // 還不夠就再從聲調補
  while (picked.length < n - 1){ const vs = shuffle(variants(word, 'tone')).filter(v => !seen.has(v)); if (!vs.length) break; picked.push({ z:vs[0], cat:'tone' }); seen.add(vs[0]); }
  return shuffle([{ z:word.z, ok:true }, ...picked]);
}

function farmKey(dx, dy){
  const me = FM.me; if (me.path.length || me.sliding || me.fly || FM.ride || qzEl().querySelector('.farm-block')) return;
  if (dx) me.face = dx;
  const nx = me.x + dx, ny = me.y + dy, a = FM.animals.find(o => o.x === nx && o.y === ny);
  if (a){ feedAnimal(a); return; }   // 撞到動物就餵牠
  const rk = rocketOn(nx, ny); if (rk){ goRocket(rk); return; }   // 撞到火箭就坐上去

}
function farmLoop(){
  const M = FM;

  M.frame++;
  const me = M.me;
  if (M.ride){ rideStep(); drawFarm(); requestAnimationFrame(farmLoop); return; }
  if (me.fly){ flyStep(); drawFarm(); requestAnimationFrame(farmLoop); return; }
  for (let rep = me.sliding ? 2 : 1; rep > 0 && me.path.length; rep--){
    const [tx, ty] = me.path[0], gx = tx * FT, gy = ty * FT;
    if (gx !== me.px) me.face = gx > me.px ? 1 : -1;
    me.px += Math.sign(gx - me.px) * Math.min(2, Math.abs(gx - me.px)); me.py += Math.sign(gy - me.py) * Math.min(2, Math.abs(gy - me.py));
    if (me.sliding) me.slD = Math.min(me.slide.total, me.slD + 2);
    M.hist.push({ x:me.px, y:me.py + meOff() }); if (M.hist.length > 600) M.hist.shift();
    if (me.px === gx && me.py === gy){
      const fx = me.x, fy = me.y;
      me.x = tx; me.y = ty; me.path.shift();
      if (me.freeSteps) me.freeSteps--; else if (!me.sliding) petStep();
      const tr = (tx !== fx || ty !== fy) && !isTramp(M.mi, fx, fy) && isTramp(M.mi, tx, ty);
      if (tr && startFly(tr, tx, ty, tx - fx, ty - fy)) break;   // 踩到跳跳床

      const lad = !me.sliding && ladderAt(M.mi, tx, ty);
      if (lad){ startSlide(lad); break; }   // 走到梯子：開始溜
      if (mapRows(M.mi)[ty][tx] === 'E'){ switchMap(tx === 0 ? -1 : 1); requestAnimationFrame(farmLoop); return; }
      if (!me.path.length && M.target){ const a = M.target; M.target = null; if (M.animals.includes(a) && nextTo(a, me.x, me.y)) feedAnimal(a); }
      if (!me.path.length && M.rocketGo){ const r = M.rocketGo; M.rocketGo = null; if (rocketDoors(r).some(([x, y]) => x === me.x && y === me.y)) startRide(r); }

}
function drawFarm(){
  const M = FM, g = M.cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(getBg(M.mi), 0, 0);
  const ents = [];
  M.animals.forEach(a => ents.push({ y:a.y * FT, f:() => {
    const bob = a.munch > 0 ? (a.munch-- % 8 < 4 ? -2 : 0) : (Math.floor((M.frame + a.bob) / 30) % 2 ? -1 : 0);
    fP(g, a.x * FT + 2, a.y * FT + 14, 'rgba(0,0,0,.2)', 12, 2);
    g.drawImage(animalCanvas(a.sp), a.x * FT - 1, a.y * FT + 1 + bob);
  } }));
  // 跟著你的動物：排在小朋友走過的路上
  if (M.mi === SPACE_MI) M.rockets.forEach(r => {
    if (r.away) return;
    const c = padCenter(r.pads[r.at]);
    ents.push({ y:c.y + 9, f:() => drawRocket(g, r.kind, c.x + 8, c.y + 2, 0, false, M.frame) });
  });
  if (M.ride && M.ride.phase === 'fly'){   // 飛行中的火箭畫在最上面
    const R = M.ride, f = Math.min(1, R.t / RIDE_FRAMES), P = rocketPose(R, f);
    ents.push({ y:1e9, f:() => {
      for (let k = 1; k <= 7; k++){ const o = rocketPose(R, Math.max(0, f - k * .015)); if (R.r.kind === 'zigzag') fP(g, o.x - 1 + (k % 2) * 3, o.y + 14, ['#ffd23c', '#ff8ab8', '#8cc8ff'][k % 3], 2, 2); else disc(g, Math.round(o.x), Math.round(o.y + 16), 2 + (k >> 1), 2 + (k >> 1), () => k < 3 ? '#e8e8f0' : '#9a9ab0'); }
      drawRocket(g, R.r.kind, P.x, P.y, P.rot, true, M.frame);
    } });
  }
  if (M.mi < WORLD.length) QZS.pets.forEach((id, k) => {
    const h = M.hist[Math.max(0, M.hist.length - 1 - (k + 1) * 8)];
    if (rideHide(h.x, h.y)) return;
    ents.push({ y:h.y - .5, f:() => { const bob = Math.floor((M.frame + k * 7) / 14) % 2 ? -1 : 0; fP(g, h.x + 2, (h.gy ?? h.y) + 14, 'rgba(0,0,0,.2)', 12, 2);
      if (h.kind) drawSpun(g, animalCanvas(spOf(id)), h.x + 8, h.y + 8, h, 1, -9, -7); else g.drawImage(animalCanvas(spOf(id)), h.x - 1, h.y + 1 + bob);
      // 頭上的血條（飽足）：走路的時候才顯示，綠 → 黃 → 紅，紅了就快要餓了
      if (M.me.path.length || (M.flash[id] || 0) > M.frame){
        const left = 1 - (QZS.petSteps[id] || 0) / HUNGRY_STEPS, col = left > .5 ? '#3cc04c' : left > .25 ? '#fcbc3c' : '#e83838';
        fP(g, h.x + 2, h.y - 3, INK, 14, 4); fP(g, h.x + 3, h.y - 2, '#ffffff', 12, 2); fP(g, h.x + 3, h.y - 2, col, Math.max(1, Math.round(12 * left)), 2);
      } } });
  });
  ents.push({ y:M.me.py + .5, f:() => {
    if (rideHide(M.me.px, M.me.py) || (M.ride && M.ride.phase === 'fly')) return;
    const walk = M.me.path.length ? (Math.floor(M.frame / 6) % 2 ? -2 : 0) : 0;
    fP(g, M.me.px + 2, M.me.py + 14, 'rgba(0,0,0,.25)', 12, 2);
    if (M.me.fly){
      const F = M.me.fly, f = Math.min(1, F.t / F.frames), q = flyAt(F, f);
      if (F.kind === 'twirl') for (let k = 1; k <= 6; k++){ const b = flyAt(F, Math.max(0, f - k * .04)), c = ['#ffd23c', '#ff8ab8', '#8cc8ff'][k % 3]; fP(g, b.x + 6 + (k % 2) * 4, b.y + b.h + 4 + (k % 3) * 3, c, 2, 2); }
      drawSpun(g, KID, M.me.px + 5, M.me.py + 2 + q.h, q, M.me.face, -8, -11); return;
    }
    g.save(); if (M.me.face < 0){ g.translate(M.me.px * 2 + 16, 0); g.scale(-1, 1); }

const HELP_PARENT = '每次開始先選難度和題數：簡單二選一、中等三選一、困難四選一；題數 10、20 或 30 題（預設 10 題），按「確定」開始。畫面中間是一個東西或動作的像素圖和國字，下面是注音選項，選出正確的那一個（電腦也可以按 1～4）。題庫有 500 個一年級常見的詞，錯的選項專門考容易混淆的地方：聲調、ㄣ／ㄥ、ㄢ／ㄤ、ㄌ／ㄉ／ㄋ、ㄈ／ㄏ、翹舌 ㄓㄔㄕ／ㄗㄘㄙ、ㄅ／ㄆ、ㄉ／ㄊ、ㄍ／ㄎ、ㄧ／ㄩ。答對會有「叮叮叮」的音效、電腦會唸出這個詞；上方有一排空罐，題數幾題就有幾個，第一次就答對的題目，罐子就會裝滿飼料；題目做完時，簡單每答對一題拿 1 罐、中等拿 2 罐、困難拿 3 罐；答錯會有低沉的「嗶嗶」聲，這一題就拿不到罐子，可以再選到對為止。家長不用在旁邊，聽聲音就知道孩子答得對不對。題目做完會到農場地圖（左右有大入口，連著公園、外太空、海邊，往同一邊走四張會回到農場；15 種動物分散住在這四張地圖；公園有 4 座溜滑梯，長短不一、有的會轉彎，點到溜滑梯的任何地方，小朋友就會走到梯子上溜下去；還有 4 種跳跳床（小跳跳床轉一圈飛 3 格、2×2 的大跳跳床轉兩圈飛 5 格、彈簧床一路彈三下飛 4 格、彩虹星星床像陀螺一樣轉還會灑星星飛 3 格；從上面來就往下拋、從左邊來就往右拋），跟著的動物也會一隻一隻照樣飛過去，飛的路不算步數；外太空有 4 座火箭，點火箭小朋友就走過去坐進去，動物也一隻一隻塞進去，火箭飛到畫面另一邊的發射台（有的直直往上再降落、有的飛大弧線、有的在半空繞一圈、有的彎來彎去），坐火箭也不算步數，跟著的動物一起溜，溜的路不算步數）：動物散在地圖上，點地圖小朋友就會走過去，點動物會走到牠旁邊餵一罐（電腦也可以用方向鍵走路，撞到動物就餵），餵一罐動物就會排在後面跟著你走，可以一直餵下一隻；每種動物各有 2 隻；跟著你的動物走路時頭上會顯示血條，走的步數超過地圖的格子數（24×15＝360 步）就會肚子餓、掉隊，留在原地等你再去餵；點跟著你的動物會顯示牠的血條和還可以走幾步，並問要不要現在餵牠，餵一罐血條就補滿；沒用完的飼料罐和跟著你的動物會留到下次。也可以不餵，直接按「再玩一次」。如果題目全部第一次就答對，會先玩 30 秒的「接罐子」：天上會掉飼料罐和垃圾，小朋友頭上扛著簍子左右移動（電腦用左右鍵，手機按住畫面或下面的按鈕），接到幾罐就多幾罐，垃圾只是來搗蛋的、接到不加分；飼料罐用完時，會跳出「重新蒐集飼料罐」，按確定回去答題。上方的「錯題紀錄」隨時可以看，會統計最常錯的類型、常選錯的詞（對的注音和孩子選的注音對照）和最近的錯題，也可以清空；之後出題時會優先複習以前錯過的詞。唸詞用的是裝置內建的中文語音，有些電腦沒有中文語音，就只會有音效。';
function openHelp(){
  SFX.blip();
  $('modal').innerHTML = `<div class="qz-panel">
    <div class="qz-title">📖 ${Z('ㄧㄡˊ ㄒㄧˋ ㄕㄨㄛ ㄇㄧㄥˊ', '遊戲說明')}</div>
    <ul class="help-list">${HELP_KID.map(([ico, z, h]) => `<li><span class="ico">${ico}</span><span>${Z(z, h)}</span></li>`).join('')}</ul>
    <div class="parent"><h3>給家長</h3><p>${HELP_PARENT}</p></div>
    <div class="qz-row"><button class="btn" data-close>${Z('ㄨㄛˇ ㄓ ㄉㄠˋ ˙ㄌㄜ', '我知道了')}</button></div>
  </div>`;
  $('modal').hidden = false;
  setTimeout(() => $('modal').querySelector('[data-close]').focus(), 30);
}
const closeHelp = () => { $('modal').hidden = true; };
$('modal').addEventListener('click', e => {
  if (e.target === $('modal') || e.target.closest('[data-close]')){ closeHelp(); return; }
  const c = e.target.closest('[data-clearlog]');
  if (c){   // 清空：在畫面上再按一次確認
    if (!c.dataset.sure){ c.dataset.sure = '1'; c.textContent = '⚠️ 再按一次，確定清空'; return; }
    QZS.log = emptyLog(); QZS.seen = []; qzSave(); openLog();
  }
});
$('btnLog').onclick = openLog;
$('btnHelp').onclick = openHelp;
$('btnHome').onclick = () => { audio(); SFX.blip(); closeHelp(); FM = null; qzHome(); };   // 回到遊戲一開始（選難度）的畫面
const toggle = (btn, on) => btn.setAttribute('aria-pressed', String(on));
$('btnSnd').onclick = () => { muted = !muted; toggle($('btnSnd'), !muted); if (!muted) SFX.blip(); };
$('btnVoice').onclick = () => { voiceOn = !voiceOn; toggle($('btnVoice'), voiceOn); if (voiceOn) speak('注音'); else if (canSpeak) speechSynthesis.cancel(); };
if (!canSpeak) $('btnVoice').hidden = true;
$('stage').addEventListener('click', e => { audio(); qzClick(e); });
addEventListener('keydown', e => {
  if (!$('modal').hidden){ if (e.key === 'Escape') closeHelp(); return; }
  if (QZ && /^[1-4]$/.test(e.key)){ e.preventDefault(); qzAnswer(+e.key - 1); return; }
  const dir = { ArrowUp:[0, -1], ArrowDown:[0, 1], ArrowLeft:[-1, 0], ArrowRight:[1, 0] }[e.key];
  if (CT && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){ e.preventDefault(); CT.key = e.key === 'ArrowLeft' ? -1 : 1; return; }
  if (FM && dir){ e.preventDefault(); farmKey(dir[0], dir[1]); }
});
addEventListener('keyup', e => { if (CT && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) CT.key = 0; });
$('logoText').innerHTML = Z('ㄓㄨˋ ㄧㄣ ㄉㄚˋ ㄊㄧㄠˇ ㄓㄢˋ', '注音大挑戰');
qzHome();
</script>
